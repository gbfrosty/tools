<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whiteout Battle Report OCR - Multi-Role Stats</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <style>
    /* Scale down default root typography for compact layout */
    html {
      font-size: 16px;
    }

    body {
      padding-top: 1rem;
      padding-bottom: 1.5rem;
    }

    /* Article containers padding adjustment */
    article {
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    /* Article headers adjustment */
    article > header {
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 1.15rem;
      margin-bottom: 0;
    }

    /* Single row layout for File Upload & Extract Button */
    .upload-row {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .upload-row .file-field {
      flex: 1;
      margin-bottom: 0;
    }

    .upload-row label {
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }

    .upload-row input[type="file"] {
      margin-bottom: 0;
      padding: 0.35rem 0.5rem;
      font-size: 0.85rem;
    }

    .upload-row button {
      width: auto;
      margin-bottom: 0;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* Compact file selection list */
    .file-selection-list {
      max-height: 220px;
      overflow-y: auto;
      margin-top: 0.75rem;
      margin-bottom: 0.5rem;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      background: var(--pico-card-background-color);
    }

    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }

    .file-row:last-child {
      border-bottom: none;
    }

    .file-row .file-title {
      word-break: break-all;
      flex: 1 1 auto;
      font-size: 0.8rem;
    }

    .file-row select,
    .file-row input[type="text"] {
      flex: 0 0 auto;
      width: 130px;
      margin-bottom: 0;
      padding: 0.2rem 0.4rem;
      font-size: 0.8rem;
      height: auto;
    }

    /* Dense table styling */
    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 0.5rem;
    }

    table th, table td {
      white-space: nowrap;
      font-size: 0.75rem;
      padding: 0.35rem 0.5rem;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .button-group button {
      width: auto;
      margin-bottom: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
    }

    #status {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--pico-primary);
      margin-top: 0.25rem;
    }

    /* Responsive adjustments for file selection list on smaller screens */
    @media (max-width: 600px) {
      .file-row {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        padding: 0.75rem 0;
      }

      .file-row .file-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        width: 100%;
      }

      /* Expand inputs to fill available space evenly in mobile view */
      .file-row select,
      .file-row input[type="text"] {
        flex: 1 1 calc(50% - 0.25rem); /* Two items per row on mobile */
        min-width: 110px;
        width: 100%;
      }

      /* Make the select dropdown span full width if placed on its own row */
      .file-row select {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 style="text-align: center;">Whiteout Battle Report Reader</h1>

    <article>
      <header>
        <h2>1. Upload Battle Reports</h2>
      </header>
      
      <div class="upload-row">
        <div class="file-field">
          <label for="image-input">Select Screenshots</label>
          <input type="file" id="image-input" multiple accept="image/*" onchange="renderFileList()">
        </div>
        <button onclick="processImages()">Extract Stats</button>
      </div>

      <div id="file-list" class="file-selection-list" style="display: none;"></div>
      <div id="status">Status: Ready</div>
    </article>

    <article>
      <header>
        <h2>2. Parsed Statistics (12 Stats)</h2>
      </header>
      
      <div class="button-group">
        <button class="contrast" onclick="copyForExcel()">Copy for Excel / Sheets</button>
        <button class="secondary" onclick="downloadCSV()">Download CSV File</button>
      </div>

      <div class="table-container">
        <table class="striped">
          <thead>
            <tr>
              <th>Name</th>
              <th>Formation</th>
              <th>Inf Atk</th><th>Inf Def</th><th>Inf Leth</th><th>Inf HP</th>
              <th>Lan Atk</th><th>Lan Def</th><th>Lan Leth</th><th>Lan HP</th>
              <th>Mar Atk</th><th>Mar Def</th><th>Mar Leth</th><th>Mar HP</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="14" style="text-align:center; color: var(--pico-muted-color);">No report images uploaded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </article>

  </main>

  <script>
    let parsedRecords = [];

    function renderFileList() {
      const fileInput = document.getElementById('image-input');
      const fileListEl = document.getElementById('file-list');
      const files = fileInput.files;
      const statusEl = document.getElementById('status');

      if (files.length === 0) {
        fileListEl.style.display = 'none';
        return;
      }

      fileListEl.innerHTML = '';
      fileListEl.style.display = 'block';

      Array.from(files).forEach((file, index) => {
        const row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = `
          <span class="file-title">${file.name}</span>
          <div class="file-controls">
            <input type="text" id="player1-name-${index}" placeholder="Player 1 Name">
            <input type="text" id="player2-name-${index}" placeholder="Player 2 Name">
            <select id="player-select-${index}">
              <option value="Player 1" selected>Player 1</option>
              <option value="Player 2">Player 2</option>
              <option value="Both">Both</option>
            </select>
          </div>
        `;
        fileListEl.appendChild(row);
      });

      statusEl.innerText = 'Ready for extraction';
    }

    // Helper to load a File object into an Image element
    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url); // Clean up memory
          resolve(img);
        };
        img.onerror = (err) => {
          URL.revokeObjectURL(url);
          reject(err);
        };
        img.src = url;
      });
    }

    // Pre-process screenshot: isolate target text colors and turn everything else greyscale
    function adjustColours(imageSource, targetColorsRGB = [], options = {}) {
      const {
        scale = 1, // 2      // Scale multiplier
        tolerance = 40,     // Color matching tolerance
        invert = false,     // Invert text color match
        isPixelFont = false // Disable smoothing for sharp pixel fonts
      } = options;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = imageSource.width * scale;
      canvas.height = imageSource.height * scale;

      ctx.imageSmoothingEnabled = !isPixelFont;
      if (!isPixelFont) {
        ctx.imageSmoothingQuality = 'high';
      }
      
      ctx.drawImage(imageSource, 0, 0, canvas.width, canvas.height);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      const matchedColorVal = invert ? 255 : 0; // Pure black or pure white match

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // Check if pixel matches ANY of the target RGB colors
        const isMatch = targetColorsRGB.some(target => 
          Math.abs(r - target.r) <= tolerance &&
          Math.abs(g - target.g) <= tolerance &&
          Math.abs(b - target.b) <= tolerance
        );

        if (isMatch) {
          // Target text color match -> output isolated high-contrast color
          data[i] = matchedColorVal;     // Red
          data[i + 1] = matchedColorVal; // Green
          data[i + 2] = matchedColorVal; // Blue
        } else {
          // Non-matching pixel -> convert to greyscale using relative luminance
          const gray = 0.299 * r + 0.587 * g + 0.114 * b;
          data[i] = gray;     // Red
          data[i + 1] = gray; // Green
          data[i + 2] = gray; // Blue
        }
      }

      ctx.putImageData(imgData, 0, 0);
      
      //document.body.appendChild(canvas)
      
      return canvas.toDataURL('image/png');
    }

    async function processImages() {
      const fileInput = document.getElementById('image-input');
      const statusEl = document.getElementById('status');
      const files = fileInput.files;

      if (files.length === 0) {
        alert('Please select one or more battle report images.');
        return;
      }

      parsedRecords = [];
      statusEl.innerText = 'Initializing WebAssembly OCR Engine...';

      const worker = await Tesseract.createWorker('eng');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const selectedPlayer = document.getElementById(`player-select-${i}`).value;
        const player1NameInput = document.getElementById(`player1-name-${i}`).value.trim();
        const player2NameInput = document.getElementById(`player2-name-${i}`).value.trim();

        const player1Name = player1NameInput || 'Player 1';
        const player2Name = player2NameInput || 'Player 2';

        statusEl.innerText = `Processing report ${i + 1} of ${files.length}: ${file.name}...`;

        try {
          const loadedImage = await loadImageFromFile(file);
          const image = await adjustColours(loadedImage, [
            { r: 224, g: 54, b: 41 }, // Red text
            { r: 100, g: 167, b: 72 }, // Green text
            { r: 147, g: 124, b: 106 } // Brown text
          ]);

          const result = await worker.recognize(image);
          const rawText = result.data.text;

          if (selectedPlayer === 'Player 1' || selectedPlayer === 'Both') {
            parsedRecords.push(parseBattleReportText(player1Name, 'Player 1', rawText));
          }
          if (selectedPlayer === 'Player 2' || selectedPlayer === 'Both') {
            parsedRecords.push(parseBattleReportText(player2Name, 'Player 2', rawText));
          }
        } catch (err) {
          console.error('Failed to read image:', file.name, err);
        }
      }

      await worker.terminate();
      statusEl.innerText = `Successfully processed ${files.length} report(s)!`;

      renderTable();
    }

    function parseBattleReportText(name, role, text) {
      //console.log(text)
      const getFormation = () => {
        // Creating the regex literal inside the helper guarantees lastIndex starts fresh at 0
        const regex = /(?<!\+)\b(\d+)\.(\d{2})\d*(?:%|7)/g;
        
        const parsedNumbers = [];
        let match;

        while ((match = regex.exec(text)) !== null) {
          const truncatedValue = `${match[1]}.${match[2]}`;
          parsedNumbers.push(parseFloat(truncatedValue));
        }

        const formations = [];
        let currentGroup = [];
        let currentSum = 0;

        for (const num of parsedNumbers) {
          currentGroup.push(`${num}%`);
          currentSum += num;

          // Check if the running sum reaches approximately 100%
          if (currentSum >= 98 && currentSum <= 102) {
            formations.push(currentGroup.join(' '));
            currentGroup = [];
            currentSum = 0;
          }
        }

        if (currentGroup.length > 0) {
          formations.push(currentGroup.join(' '));
        }

        return role === 'Player 1' ? (formations[0] || 'N/A') : (formations[1] || 'N/A');
      };

      const getStat = (troop, stat) => {
        let regex;
        if (role === 'Player 1') {
          // Player 1 values precede stat label (e.g., "50% Infantry Attack")
          regex = new RegExp(`(?:\\+?\\s*([\\d\\.]+)\\s*%)[^\\n]*?${troop}\\s*${stat}`, 'i');
        } else {
          // Player 2 values follow stat label (e.g., "Infantry Attack 50%")
          regex = new RegExp(`${troop}\\s*${stat}[^\\n]*?(?:\\+?\\s*([\\d\\.]+)\\s*)`, 'i');
        }

        const match = text.match(regex);
        return match ? match[1] + '%' : 'N/A';
      };

      return {
        name: name,
        role: role,
        formation: getFormation(),
        // Infantry
        infAtk: getStat('Infantry', 'Attack'),
        infDef: getStat('Infantry', 'Defense'),
        infLeth: getStat('Infantry', 'Lethality'),
        infHp: getStat('Infantry', 'Health'),
        // Lancer
        lanAtk: getStat('Lancer', 'Attack'),
        lanDef: getStat('Lancer', 'Defense'),
        lanLeth: getStat('Lancer', 'Lethality'),
        lanHp: getStat('Lancer', 'Health'),
        // Marksman
        marAtk: getStat('Marksman', 'Attack'),
        marDef: getStat('Marksman', 'Defense'),
        marLeth: getStat('Marksman', 'Lethality'),
        marHp: getStat('Marksman', 'Health')
      };
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (parsedRecords.length === 0) {
        tbody.innerHTML = '<tr><td colspan="14" style="text-align:center; color: var(--pico-muted-color);">No report images uploaded yet.</td></tr>';
        return;
      }

      parsedRecords.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.name}</td>
          <td>${row.formation}</td>
          <td>${row.infAtk}</td><td>${row.infDef}</td><td>${row.infLeth}</td><td>${row.infHp}</td>
          <td>${row.lanAtk}</td><td>${row.lanDef}</td><td>${row.lanLeth}</td><td>${row.lanHp}</td>
          <td>${row.marAtk}</td><td>${row.marDef}</td><td>${row.marLeth}</td><td>${row.marHp}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function copyForExcel() {
      if (parsedRecords.length === 0) return alert('No parsed data available.');

      const headers = [
        "Name", "Formation",
        "Infantry Atk", "Infantry Def", "Infantry Lethality", "Infantry HP",
        "Lancer Atk", "Lancer Def", "Lancer Lethality", "Lancer HP",
        "Marksman Atk", "Marksman Def", "Marksman Lethality", "Marksman HP"
      ];

      let tsvText = headers.join('\t') + '\n';
      parsedRecords.forEach(row => {
        tsvText += [
          row.name, row.formation,
          row.infAtk, row.infDef, row.infLeth, row.infHp,
          row.lanAtk, row.lanDef, row.lanLeth, row.lanHp,
          row.marAtk, row.marDef, row.marLeth, row.marHp
        ].join('\t') + '\n';
      });

      navigator.clipboard.writeText(tsvText).then(() => {
        alert('Copied stats to clipboard! Switch to Excel or Google Sheets and press Ctrl+V.');
      });
    }

    function downloadCSV() {
      if (parsedRecords.length === 0) return alert('No parsed data available.');

      let csvContent = "Name,Formation,Infantry Atk,Infantry Def,Infantry Lethality,Infantry HP,Lancer Atk,Lancer Def,Lancer Lethality,Lancer HP,Marksman Atk,Marksman Def,Marksman Lethality,Marksman HP\n";
      
      parsedRecords.forEach(row => {
        csvContent += `"${row.name}",${row.formation}","${row.infAtk}","${row.infDef}","${row.infLeth}","${row.infHp}","${row.lanAtk}","${row.lanDef}","${row.lanLeth}","${row.lanHp}","${row.marAtk}","${row.marDef}","${row.marLeth}","${row.marHp}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `battle_reports_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
